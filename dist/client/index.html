<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple personal finance tracker for balances, expenses, loans, and subscriptions." />
    <title>Balance — Finance Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="period-picker" id="periodPicker">
          <button class="period-trigger" id="periodTrigger" type="button" aria-expanded="false" aria-haspopup="listbox">
            <span id="periodLabel">Current</span>
            <span class="chevron" aria-hidden="true"></span>
          </button>
          <div class="period-menu" id="periodMenu" role="listbox" aria-label="Balance timeframe" hidden>
            <button type="button" role="option" data-period="current" aria-selected="true">Current</button>
            <button type="button" role="option" data-period="day">In a day</button>
            <button type="button" role="option" data-period="week">In a week</button>
            <button type="button" role="option" data-period="month">In a month</button>
          </div>
        </div>

        <button class="add-button" id="openAdd" type="button" aria-label="Add a transaction">
          <span aria-hidden="true"></span>
        </button>
      </header>

      <section class="balance-hero" aria-live="polite">
        <p class="balance-kicker" id="balanceKicker">CURRENT BALANCE</p>
        <h1 id="balanceAmount">$20.00</h1>
        <p class="balance-note" id="balanceNote">Available now</p>
      </section>

      <div class="ledger-layout">
        <nav class="filters" aria-label="Transaction categories">
          <p class="filter-heading">SORT BY</p>
          <button class="filter-button active" type="button" data-filter="general">General <span id="countGeneral">0</span></button>
          <button class="filter-button" type="button" data-filter="loans">Loans <span id="countLoans">0</span></button>
          <button class="filter-button" type="button" data-filter="subscriptions">Subscriptions <span id="countSubscriptions">0</span></button>
          <button class="filter-button" type="button" data-filter="expenses">Expenses <span id="countExpenses">0</span></button>
        </nav>

        <section class="ledger" aria-labelledby="ledgerTitle">
          <div class="ledger-header">
            <div>
              <p class="eyebrow">ACTIVITY</p>
              <h2 id="ledgerTitle">General</h2>
            </div>
            <p id="entryCount">0 entries</p>
          </div>
          <div class="transaction-list" id="transactionList"></div>
          <div class="empty-state" id="emptyState" hidden>
            <p>No entries in this category.</p>
            <button type="button" id="emptyAdd">Add one</button>
          </div>
        </section>
      </div>
    </main>

    <div class="modal-backdrop" id="modalBackdrop" hidden>
      <section class="add-panel" role="dialog" aria-modal="true" aria-labelledby="addTitle">
        <div class="panel-header">
          <div class="type-picker" id="typePicker">
            <button class="type-trigger" id="typeTrigger" type="button" aria-expanded="false" aria-haspopup="listbox">
              <span id="typeLabel">Expense</span>
              <span class="chevron" aria-hidden="true"></span>
            </button>
            <div class="type-menu" id="typeMenu" role="listbox" aria-label="Entry type" hidden>
              <button type="button" role="option" data-type="expenses" aria-selected="true">Expense</button>
              <button type="button" role="option" data-type="subscriptions">Subscription</button>
              <button type="button" role="option" data-type="loans">Loan</button>
            </div>
          </div>
          <button class="close-button" id="closeAdd" type="button" aria-label="Close add panel"><span aria-hidden="true"></span></button>
        </div>

        <form id="entryForm">
          <h2 id="addTitle">Add expense</h2>
          <p class="form-intro">Use a positive amount for money received and a negative amount for money spent.</p>

          <label for="entryName">Description</label>
          <input id="entryName" name="name" type="text" placeholder="e.g. Groceries" maxlength="60" required autocomplete="off" />

          <label for="entryAmount">Amount</label>
          <div class="money-input">
            <span>$</span>
            <input id="entryAmount" name="amount" type="number" placeholder="-12.50" step="0.01" required />
          </div>

          <div id="standardDateField">
            <label for="entryDate">Date</label>
            <input id="entryDate" name="date" type="date" required />
          </div>

          <div class="conditional-fields" id="subscriptionFields" hidden>
            <label for="frequency">Repeats</label>
            <select id="frequency" name="frequency">
              <option value="weekly">Every week</option>
              <option value="monthly" selected>Every month</option>
              <option value="yearly">Every year</option>
            </select>
            <label for="nextDate">Next payment date</label>
            <input id="nextDate" name="nextDate" type="date" />
          </div>

          <div class="conditional-fields" id="loanFields" hidden>
            <label for="loanPerson">Person or lender</label>
            <input id="loanPerson" name="person" type="text" placeholder="e.g. Jordan" maxlength="40" autocomplete="off" />
            <label for="dueDate">Due date</label>
            <input id="dueDate" name="dueDate" type="date" />
          </div>

          <p class="form-error" id="formError" role="alert"></p>
          <button class="submit-button" type="submit"><span class="small-plus" aria-hidden="true"></span> Add entry</button>
        </form>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
